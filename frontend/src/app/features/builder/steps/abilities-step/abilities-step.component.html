<app-card-panel [title]="i18n.t('abilities.title')" [collapsible]="false">
  <div class="controls">
    <div class="method-switch" role="group" [attr.aria-label]="i18n.t('abilities.generationMethod')">
      <button
        type="button"
        class="method-btn"
        [class.active]="method() === 'pointBuy'"
        (click)="setMethod('pointBuy')"
      >
        {{ i18n.t('abilities.pointBuy') }}
      </button>
      <button
        type="button"
        class="method-btn"
        [class.active]="method() === 'manual'"
        (click)="setMethod('manual')"
      >
        {{ i18n.t('abilities.manual') }}
      </button>
    </div>

    @if (method() === 'pointBuy') {
      <div class="budget-row">
        <span class="budget-label">{{ i18n.t('abilities.pointBudget') }}</span>
        <div class="budget-presets">
          @for (preset of pointBuyPresets; track preset) {
            <button
              type="button"
              class="budget-btn"
              [class.active]="budget() === preset"
              (click)="setBudget(preset)"
            >
              {{ preset }}
            </button>
          }
        </div>
        <span class="remaining" [class.negative]="remainingPoints() < 0">
          {{ i18n.t('abilities.remainingPoints') }}: {{ remainingPoints() }}
        </span>
      </div>
    }
  </div>

  <div class="abilities-grid">
    @for (ability of abilityOrder; track ability) {
      <app-stat-box
        [name]="ability"
        [label]="abilityLabels()[ability]"
        [score]="service.abilities()[ability]"
        (scoreChange)="setAbility(ability, $event)"
        [racialBonus]="racialBonusFor(ability)"
        [min]="minScore()"
        [max]="maxScore"
        [canIncrement]="canIncrement(ability)"
        [canDecrement]="canDecrement(ability)"
      />
    }
  </div>
</app-card-panel>
