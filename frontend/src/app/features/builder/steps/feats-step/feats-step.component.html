<div class="feats-step">
  <app-card-panel [title]="i18n.t('feats.title')" [collapsible]="false">
    <div class="feats-toolbar">
      <div class="filter-group" role="group" [attr.aria-label]="i18n.t('feats.filter')">
        @for (type of filters; track type) {
          <button
            type="button"
            class="filter-btn"
            [class.active]="filter() === type"
            (click)="filter.set(type)"
          >
            {{ type === 'all' ? i18n.t('feats.all') : i18n.getFeatTypeName(type) }}
          </button>
        }
      </div>
      <span class="feats-count" [class.negative]="selectedCount() > service.availableFeatsCount()">
        {{ i18n.t('feats.count', { selected: selectedCount(), available: service.availableFeatsCount() }) }}
      </span>
    </div>

    <div class="feats-grid">
      @for (feat of filteredFeats(); track feat.id) {
        <app-selector-card
          [title]="i18n.getFeatName(feat.id)"
          [description]="featDescription(feat)"
          [badges]="[i18n.getFeatTypeName(feat.type)]"
          [selected]="isSelected(feat.id)"
          [disabled]="!canToggle(feat.id)"
          (selectedChange)="toggle(feat)"
        />
      }
    </div>
  </app-card-panel>
</div>
